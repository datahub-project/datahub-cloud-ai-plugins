name: Portable plugin release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Require release commit to be merged into main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python scripts/verify_release_commit.py
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: |
          ruff format --check scripts tests
          ruff check scripts tests
      - name: Test packaging
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$REF_TYPE" == "tag" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          python scripts/package.py "${args[@]}"
          cd dist
          sha256sum --check *.sha256
          unzip -t *.zip
      - name: Save release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-plugin
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-plugin
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          args=()
          version="${RELEASE_TAG%%+*}"
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" *.zip *.sha256 \
            --verify-tag --generate-notes --title "DataHub Cloud $RELEASE_TAG" \
            "${args[@]}"
